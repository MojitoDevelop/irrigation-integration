<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nawodnienie — skoczek</title>
<style>body{margin:0;padding:24px;font-family:Arial,sans-serif;background:linear-gradient(120deg,#fff4ed,#d0dbed);--primary-text-color:#201e40;--secondary-text-color:#626079;--divider-color:rgba(35,32,64,.13)}body.dark{background:linear-gradient(120deg,#17243b,#222135);--primary-text-color:#dfdfe8;--secondary-text-color:#b6b7c6;--divider-color:rgba(255,255,255,.13)}.pane{max-width:480px;margin:auto}button-card{display:block}</style>
<body><main class="pane"></main><script>
class HACard extends HTMLElement {constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<slot></slot>';}}customElements.define('ha-card',HACard);
class HAIcon extends HTMLElement {constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 21h10M9 21v-5h6v5M5 16h14M12 4v3M5 6l2 2M19 6l-2 2M2 11l3 1M22 11l-3 1M8 12l4-3 4 3"/></svg>';}}customElements.define('ha-icon',HAIcon);
customElements.define('ha-state-icon',class extends HAIcon {});
window.loadCardHelpers=async()=>({});window.actionEvents=[];document.addEventListener('hass-action',e=>window.actionEvents.push(e.detail));
window.demoStatus={entity_id:'sensor.irrigation_status',state:'Podlewanie: Trawnik rano, Rabaty · zawory: 1, 2, 4',attributes:{mode:'automatic',open_valves:[1,2,4],errors:[]}};
window.publish=()=>{window.navCard.hass={states:{'sensor.irrigation_status':window.demoStatus},user:{is_admin:true},themes:{darkMode:document.body.classList.contains('dark'),themes:{}},config:{unit_system:{}},locale:{language:window.demoLanguage || 'pl'},localize:key=>key,connection:{subscribeMessage:async()=>()=>{}}};};
</script><script src="/button-card.js"></script><script>
(async()=>{await customElements.whenDefined('button-card');window.navCard=document.createElement('button-card');window.navCard.setConfig(await(await fetch('/navigation-card.json')).json());window.publish();document.querySelector('.pane').append(window.navCard);})();
</script></body></html>
