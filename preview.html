<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harmonogram nawodnienia — podgląd</title><style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(120deg,#fff4ed,#e3e6f1 65%,#d0dbed);--primary-text-color:#201e40;--secondary-text-color:#626079;--error-color:#ba4057;--card-background-color:#f1f1f7}.pane{box-sizing:border-box;max-width:540px;margin:auto;padding:22px}body.dark{background:linear-gradient(120deg,#17243b,#222135 65%,#15283a);--primary-text-color:#dfdfe8;--secondary-text-color:#b6b7c6;--error-color:#f29c9c;--card-background-color:#242537}irrigation-schedule-integration-card{display:block}
</style><body><main class="pane"></main><script type="module">
import {createSchedule,DAYS,isCatalogSchedule,decodeCatalog} from './schedule-model.js';
class HACard extends HTMLElement {} customElements.define('ha-card',HACard);
await import('./irrigation-schedule-integration-card.js');
window.demoCatalog={valves:Array.from({length:12},(_,i)=>({entity:'switch.garden_'+(i+1),name:i===0?'Trawnik':i===1?'Rabaty':'Strefa '+(i+1)})),retired:[]};window.wsCalls=[];window.serviceCalls=[];window.failWrites=false;window.demoCounter=10;
window.demoSchedules=[['fixture-storage-a','Trawnik rano',['monday','wednesday','friday'],'05:00','05:20',['switch.garden_1','switch.garden_2']],['fixture-storage-b','Rabaty',['monday','wednesday','friday'],'05:10','05:40',['switch.garden_2','switch.garden_4']]].map(([id,title,days,from,to,zones])=>{const{type,...rest}=createSchedule({id:'logical-'+id,title,days,from,to,zones});return{id,...rest};});
window.demoRegistry=window.demoSchedules.map((s,i)=>({platform:'schedule',unique_id:s.id,entity_id:'schedule.nawodnienie_demo_'+i,disabled_by:null}));
window.demoStates={'switch.nawodnienie_automatyka':{state:'on',attributes:{}},'sensor.nawodnienie_integracja_status':{state:'Podlewanie: Trawnik rano, Rabaty · zawory: 1, 2, 4',attributes:{mode:'automatic'}}};
for(let n=1;n<=12;n++)window.demoStates['switch.garden_'+n]={state:[1,2,4].includes(n)?'on':'off',attributes:{friendly_name:'Nawodnienie strefa '+n}};
for(const r of window.demoRegistry){const s=window.demoSchedules.find(s=>s.id===r.unique_id);window.demoStates[r.entity_id]={state:'on',attributes:{editable:true,friendly_name:s.name,...s.monday[0].data}};}
window.scheduleListeners=new Set();window.subscribeCalls=0;window.unsubscribeCalls=0;
window.emitScheduleChanges=changes=>{for(const callback of scheduleListeners)callback(structuredClone(changes));};
window.readyListeners=new Set();
window.demoConnection={
 addEventListener:(type,callback)=>{if(type==='ready')readyListeners.add(callback);},
 removeEventListener:(type,callback)=>{if(type==='ready')readyListeners.delete(callback);},
 subscribeMessage:async(callback,request)=>{
 if(request.type!=='schedule/subscribe')throw Error('Unexpected subscription');
 window.subscribeCalls++;scheduleListeners.add(callback);
 callback(demoSchedules.map(item=>({change_type:'added',schedule_id:item.id,item})));
 return()=>{window.unsubscribeCalls++;scheduleListeners.delete(callback);};
}};
function hass(){return{connection:window.demoConnection,locale:{language:window.demoLanguage || 'pl'},states:window.demoStates,user:{is_admin:true},themes:{darkMode:document.body.classList.contains('dark')},callWS:async req=>{
 window.wsCalls.push(structuredClone(req));await new Promise(resolve=>setTimeout(resolve,25));
 if(window.failWrites&&['schedule/create','schedule/update','schedule/delete','irrigation_schedule/configure_valves'].includes(req.type))throw Error('Odmowa zapisu');
 if(req.type==='irrigation_schedule/config')return{entry_id:'entry-1',valves:structuredClone(demoCatalog.valves),retired:structuredClone(demoCatalog.retired),master_entity:'switch.nawodnienie_automatyka',status_entity:'sensor.nawodnienie_integracja_status'};
 if(req.type==='irrigation_schedule/configure_valves'){
  const retired=[...demoCatalog.retired,...demoCatalog.valves].filter(v=>!req.valves.some(n=>n.entity===v.entity));demoCatalog={valves:structuredClone(req.valves),retired:[...new Map(retired.map(v=>[v.entity,v])).values()]};publish();return structuredClone(demoCatalog);
 }
 if(req.type==='irrigation_schedule/manual'){
  if(demoStates['switch.nawodnienie_automatyka'].state!=='off'||demoStates['sensor.nawodnienie_integracja_status'].attributes.mode!=='manual')throw Error('Wyłącz automatykę');
  const ids=req.entity?[req.entity]:demoCatalog.valves.map(v=>v.entity);for(const id of ids){if(!demoCatalog.valves.some(v=>v.entity===id))throw Error('Nieznany zawór');demoStates[id].state=req.enabled?'on':'off';}publish();return null;
 }
 if(req.type==='schedule/list')return structuredClone(window.demoSchedules);
 if(req.type==='config/entity_registry/list')return structuredClone(window.demoRegistry);
 if(req.type==='schedule/create'){
  for(const day of DAYS)for(const b of req[day]||[])for(const value of Object.values(b.data||{}))if(!['string','number','boolean'].includes(typeof value))throw Error('HA Additional data only accepts scalar values');
  const{type,...rest}=req,s={id:'created-storage-'+ ++window.demoCounter,...rest},entity_id='schedule.nawodnienie_demo_'+window.demoCounter;window.demoSchedules.push(s);window.demoRegistry.push({platform:'schedule',unique_id:s.id,entity_id,disabled_by:null});window.demoStates[entity_id]={state:'off',attributes:{editable:true,friendly_name:s.name}};window.publish();emitScheduleChanges([{change_type:'added',schedule_id:s.id,item:s}]);return structuredClone(s);
 }
 if(req.type==='schedule/update'){const index=window.demoSchedules.findIndex(s=>s.id===req.schedule_id);if(index<0)throw Error('Unknown storage ID');const{type,schedule_id,...rest}=req;window.demoSchedules[index]={id:schedule_id,...rest};const r=window.demoRegistry.find(r=>r.unique_id===schedule_id);window.demoStates[r.entity_id].attributes.friendly_name=req.name;window.publish();emitScheduleChanges([{change_type:'updated',schedule_id,item:window.demoSchedules[index]}]);return structuredClone(window.demoSchedules[index]);}
 if(req.type==='schedule/delete'){const r=window.demoRegistry.find(r=>r.unique_id===req.schedule_id);window.demoSchedules=window.demoSchedules.filter(s=>s.id!==req.schedule_id);window.demoRegistry=window.demoRegistry.filter(r=>r.unique_id!==req.schedule_id);if(r)delete window.demoStates[r.entity_id];window.publish();emitScheduleChanges([{change_type:'removed',schedule_id:req.schedule_id}]);return null;}
 throw Error('Unexpected request '+req.type);
},callService:async(domain,service,data)=>{
 window.serviceCalls.push([domain,service,structuredClone(data)]);
 const ids=Array.isArray(data.entity_id)?data.entity_id:[data.entity_id];
 for(const id of ids)window.demoStates[id].state=service==='turn_on'?'on':'off';
 if(domain==='switch'&&data.entity_id==='switch.nawodnienie_automatyka'){
  const manual=service==='turn_off';window.demoStates['sensor.nawodnienie_integracja_status']={state:manual?'Tryb ręczny · zawory zamknięte':'Automatyka włączona · oczekuje na harmonogram',attributes:{mode:manual?'manual':'automatic'}};
  if(manual)for(let n=1;n<=12;n++)window.demoStates['switch.garden_'+n].state='off';
 }
 window.publish();
}};}
window.publish=()=>{window.demoStates['sensor.nawodnienie_integracja_status'].attributes.configured_valves=structuredClone(demoCatalog.valves);window.demoCard.hass=hass();};window.setDark=dark=>{document.body.classList.toggle('dark',dark);window.publish();};
window.demoCard=document.createElement('irrigation-schedule-integration-card');window.demoCard.setConfig({title:'Nawodnienie',status_entity:'sensor.nawodnienie_integracja_status'});window.demoCard.hass=hass();document.querySelector('.pane').append(window.demoCard);
</script></body></html>
